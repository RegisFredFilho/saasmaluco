
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped  
    working_dir: /var/www/html
    volumes:
      - ./app:/var/www/html
    networks:
      - saas

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./app:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - saas

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - saas

  redis:
    image: redis:alpine
    restart: unless-stopped
    networks:
      - saas

  node:
    image: node:22-alpine
    working_dir: /var/www/html
    volumes:
      - ./app:/var/www/html
      - node_modules:/var/www/html/node_modules
    networks:
      - saas
    profiles:
      - frontend

networks:
  saas:

volumes:
  mysql_data:
  node_modules:
