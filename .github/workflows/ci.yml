name: SaaS Maluco CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

jobs:
  laravel:
    name: Laravel Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, fileinfo, pdo_sqlite
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Laravel tests
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: php artisan test

      - name: Check PHP code style
        run: vendor/bin/pint --test

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
 
  docker-compose:
    name: Docker Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        env:
          APP_PORT: "8080"
          DB_DATABASE: "saas_test"
          DB_USERNAME: "saas_test"
          DB_PASSWORD: "ci_dummy_password"
          MYSQL_ROOT_PASSWORD: "ci_dummy_root_password"
        run: |
          docker compose -f compose.yaml config --quiet
          echo "Docker Compose validado com sucesso!"
 
  deploy:
    name: Deploy Homologacao
    runs-on: ubuntu-latest
    needs: [laravel, frontend, docker-compose]

    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    permissions:
      contents: read

    concurrency:
      group: saasmaluco-homolog
      cancel-in-progress: false

    timeout-minutes: 30

    steps:
      - name: Conectar ao Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions-hmlgigsaa
          ping: 100.104.243.44

      - name: Configurar SSH
        env:
          HOMOLOG_SSH_KEY: ${{ secrets.HOMOLOG_SSH_KEY }}
          HOMOLOG_KNOWN_HOSTS: ${{ secrets.HOMOLOG_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$HOMOLOG_SSH_KEY" > ~/.ssh/homolog_deploy
          printf '%s\n' "$HOMOLOG_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/homolog_deploy ~/.ssh/known_hosts

      - name: Executar deploy na VM
        run: |
          ssh \
            -i ~/.ssh/homolog_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -T \
            deploy@100.104.243.44 \
            "deploy ${{ github.sha }}"

